name: warehouse-sync-ci

on:
  push:
    branches: [main, "product/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: TypeScript build
        run: npm run build
      - name: Tests
        run: npm test -- --runInBand
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build image
        run: docker build -t sky-warehouse-sync:${{ github.sha }} .
      - name: Verify non-root image
        run: test "$(docker image inspect sky-warehouse-sync:${{ github.sha }} --format '{{.Config.User}}')" = "node"
      - name: Smoke test runtime
        run: |
          set -euo pipefail
          docker run -d --name sky-warehouse-sync-ci -p 8080:8080 sky-warehouse-sync:${{ github.sha }}
          trap 'docker rm -f sky-warehouse-sync-ci >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs sky-warehouse-sync-ci
          exit 1
